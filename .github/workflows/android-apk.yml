name: Android APK

# Builds an installable release APK on GitHub's runners (which ship the Android SDK and NDK).
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.2.0.
on:
  workflow_dispatch:
    inputs:
      architectures:
        description: 'ABIs to build (comma-separated). arm64-v8a covers almost every current phone.'
        default: 'arm64-v8a'
        required: true
  push:
    branches: [chore/android-apk-workflow]
    tags: ['v*']

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ARCHITECTURES: ${{ github.event.inputs.architectures || 'arm64-v8a' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and test
        run: npm run check

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: android
        # Release builds bundle the JavaScript, so the APK runs without a dev server.
        # Without a release keystore the generated project signs with its debug key:
        # fine for installing on your own devices, not for the Play Store.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures="$ARCHITECTURES"

      - name: Name the APK
        run: |
          version=$(node -p "require('./app.json').expo.version")
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist-apk/unlock-lingo-${version}-${GITHUB_SHA::7}.apk"
          ls -lh dist-apk

      - uses: actions/upload-artifact@v4
        with:
          name: unlock-lingo-apk
          path: dist-apk/*.apk
          retention-days: 30
          if-no-files-found: error
